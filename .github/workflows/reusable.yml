name: reusable
on:
  workflow_call:
    secrets:
      PASSED:
        required: true
      WRITER_DSN:
        required: false
jobs:
  conditional:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'writer' || '' }}
    steps:
      - run: |
          echo "ref=$GITHUB_REF"
          echo "env_secret_len=${#ENV_SECRET}"
          echo "passed_len=${#PASSED}"
        env:
          ENV_SECRET: ${{ secrets.WRITER_DSN }}
          PASSED: ${{ secrets.PASSED }}
  inherit_probe:
    runs-on: ubuntu-latest
    environment: writer
    steps:
      - run: echo "declared env_secret_len=${#ENV_SECRET}"
        env:
          ENV_SECRET: ${{ secrets.WRITER_DSN }}
  forced:
    runs-on: ubuntu-latest
    environment: writer
    steps:
      - run: echo "forced env_secret_len=${#ENV_SECRET}"
        env:
          ENV_SECRET: ${{ secrets.WRITER_DSN }}
