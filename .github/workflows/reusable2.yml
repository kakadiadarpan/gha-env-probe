name: reusable2
on:
  workflow_call:
jobs:
  forced:
    runs-on: ubuntu-latest
    environment: writer
    steps:
      - run: echo "inherit-env env_secret_len=${#ENV_SECRET}"
        env:
          ENV_SECRET: ${{ secrets.WRITER_DSN }}
  noenv:
    runs-on: ubuntu-latest
    steps:
      - run: echo "inherit-noenv secret_len=${#ENV_SECRET}"
        env:
          ENV_SECRET: ${{ secrets.WRITER_DSN }}
